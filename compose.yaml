services:
  dashboard:
    build: .
    command:
      - python
      - -m
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    env_file: .env
    environment:
      STATE_DIR: /data
    volumes:
      - strategy_data:/data
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      STATE_DIR: /data
    volumes:
      - strategy_data:/data
    restart: unless-stopped

volumes:
  strategy_data: